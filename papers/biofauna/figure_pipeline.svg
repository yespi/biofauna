<svg width="100%" height="auto" viewBox="0 0 1180 500" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Helvetica,Arial,sans-serif}.t{fill:#0d1b2a;font-size:12px}.s{font-size:11px;fill:#334}.h{font-size:15px;font-weight:700;fill:#0b3d5c}.b{fill:#eef6fb;stroke:#7fb3d5;stroke-width:1.5;rx:8}.a{fill:#fdf3e7;stroke:#e0a458;stroke-width:1.5;rx:8}.g{fill:#eaf7ee;stroke:#74b98a;stroke-width:1.5;rx:8}.arr{stroke:#4a6b8a;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a6b8a"/></marker></defs>
<text class="h" x="20" y="28">1 - Como BioFauna identifica una especie</text>
<text class="s" x="20" y="46">Cada paso es auditable; k, T, cap y umbrales son los de produccion.</text>
<rect class="a" x="20" y="70" width="150" height="54"/><text class="t" x="95.0" y="101.0" text-anchor="middle">Fotografia (subida o descarga)</text>
<rect class="b" x="200" y="70" width="150" height="54"/><text class="t" x="275.0" y="101.0" text-anchor="middle">Deteccion / recorte ROI</text>
<rect class="b" x="380" y="70" width="170" height="54"/><text class="t" x="465.0" y="101.0" text-anchor="middle">BioCLIP-2.5 ViT-H/14 (frozen)</text>
<rect class="b" x="580" y="70" width="180" height="54"/><text class="t" x="670.0" y="101.0" text-anchor="middle">Embedding 1024-d: global + ROI 65%</text>
<rect class="b" x="790" y="70" width="170" height="54"/><text class="t" x="875.0" y="101.0" text-anchor="middle">Indice FAISS: 1,12 M vec / 4.543 spp</text>
<rect class="g" x="980" y="70" width="180" height="54"/><text class="t" x="1070.0" y="101.0" text-anchor="middle">k-NN k=15, agregador T=0,05</text>
<line class="arr" x1="170" y1="97" x2="200" y2="97"/>
<line class="arr" x1="350" y1="97" x2="380" y2="97"/>
<line class="arr" x1="550" y1="97" x2="580" y2="97"/>
<line class="arr" x1="760" y1="97" x2="790" y2="97"/>
<line class="arr" x1="960" y1="97" x2="980" y2="97"/>
<rect class="b" x="790" y="170" width="170" height="54"/><text class="t" x="875.0" y="201.0" text-anchor="middle">Tope 3 votos por especie</text>
<rect class="b" x="580" y="170" width="180" height="54"/><text class="t" x="670.0" y="201.0" text-anchor="middle">Prior geografico (sigma ~200 km)</text>
<rect class="b" x="380" y="170" width="170" height="54"/><text class="t" x="465.0" y="201.0" text-anchor="middle">Pares cripticos (Fisher)</text>
<rect class="b" x="180" y="170" width="170" height="54"/><text class="t" x="265.0" y="201.0" text-anchor="middle">Calibracion jerarquica spp/gen/fam</text>
<rect class="g" x="20" y="170" width="140" height="54"/><text class="t" x="90.0" y="201.0" text-anchor="middle">Umbrales + abstencion</text>
<line class="arr" x1="875" y1="124" x2="875" y2="170"/>
<line class="arr" x1="790" y1="197" x2="760" y2="197"/>
<line class="arr" x1="580" y1="197" x2="550" y2="197"/>
<line class="arr" x1="380" y1="197" x2="350" y2="197"/>
<line class="arr" x1="180" y1="197" x2="160" y2="197"/>
<rect class="g" x="20" y="290" width="300" height="58"/><text class="t" x="170.0" y="323.0" text-anchor="middle">Prediccion: especie/genero/familia + p calibrada</text>
<rect class="b" x="360" y="290" width="300" height="58"/><text class="t" x="510.0" y="323.0" text-anchor="middle">Guardas: margen k-NN <0,02 / veto cero-shot</text>
<rect class="a" x="700" y="290" width="240" height="58"/><text class="t" x="820.0" y="323.0" text-anchor="middle">AutoID publica en Minka</text>
<rect class="a" x="970" y="290" width="190" height="58"/><text class="t" x="1065.0" y="323.0" text-anchor="middle">Guardian de curadores retira IDs</text>
<line class="arr" x1="160" y1="244" x2="160" y2="290"/>
<line class="arr" x1="320" y1="319" x2="360" y2="319"/>
<line class="arr" x1="660" y1="319" x2="700" y2="319"/>
<line class="arr" x1="940" y1="319" x2="970" y2="319"/>
<text class="s" x="20" y="392">Rescate cero-shot (2026): si la similitud top-1 &lt; 0,85 y el cero-shot del catalogo (2.985 etiquetas)</text>
<text class="s" x="20" y="408">coincide con otra especie con p &gt;= 0,90, gana el cero-shot: +0,91 pp medidos en el eval de campo.</text>
<text class="s" x="20" y="432">Control de fugas: ninguna foto de evaluacion puede estar en el indice (auditoria global &gt;= 0,98; purga automatica).</text>
<text class="s" x="20" y="456">La ID de un curador manda siempre; el modelo se audita con sus correcciones.</text>
</svg>